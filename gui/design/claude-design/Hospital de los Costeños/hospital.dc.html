<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#141414;}a{color:#2f6fd6;}a:hover{color:#e5484d;}</style>
</helmet>
<div style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#141414;overflow:hidden">
  <div ref="{{ rootRef }}" data-screen-label="Hospital Map" style="position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;font-family:'Press Start 2P',monospace;background:#f3d68e;user-select:none">
    <canvas ref="{{ worldRef }}" width="928" height="522" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block"></canvas>

    <div style="position:absolute;left:11.422%;top:23.372%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">ROOM 101</div>
    <div style="position:absolute;left:32.759%;top:23.372%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">ROOM 102</div>
    <div style="position:absolute;left:54.095%;top:23.372%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">ROOM 103</div>
    <div style="position:absolute;left:90.086%;top:23.372%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">RADIOLOGY</div>
    <div style="position:absolute;left:2.586%;top:28.736%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">HALLWAY 1</div>
    <div style="position:absolute;left:65.086%;top:65.134%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">HALLWAY 2</div>
    <div style="position:absolute;left:2.371%;top:65.9%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">CAFETERIA</div>
    <div style="position:absolute;left:28.879%;top:65.9%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">LOBBY</div>
    <div style="position:absolute;left:89.224%;top:65.9%;font-size:0.7cqw;line-height:1;color:#141414;white-space:nowrap">STAFF ROOM</div>

    <div style="position:absolute;left:11.207%;top:26.628%;transform:translate(-50%,-50%);background:#c4302b;border:0.25cqw solid #141414;padding:0.3cqw 0.4cqw;font-size:0.6cqw;line-height:1;color:#ffffff;white-space:nowrap;box-shadow:inset -0.2cqw -0.2cqw 0 #8f2420,0.25cqw 0.35cqw 0 rgba(0,0,0,0.22)">OCCUPIED</div>
    <div style="position:absolute;left:32.543%;top:26.628%;transform:translate(-50%,-50%);background:#1f8a3a;border:0.25cqw solid #141414;padding:0.3cqw 0.4cqw;font-size:0.6cqw;line-height:1;color:#ffffff;white-space:nowrap;box-shadow:inset -0.2cqw -0.2cqw 0 #16692b,0.25cqw 0.35cqw 0 rgba(0,0,0,0.22)">AVAILABLE</div>
    <div style="position:absolute;left:53.879%;top:26.628%;transform:translate(-50%,-50%);background:#c4302b;border:0.25cqw solid #141414;padding:0.3cqw 0.4cqw;font-size:0.6cqw;line-height:1;color:#ffffff;white-space:nowrap;box-shadow:inset -0.2cqw -0.2cqw 0 #8f2420,0.25cqw 0.35cqw 0 rgba(0,0,0,0.22)">OCCUPIED</div>

    <dc-import name="Personaje" tipo="paciente" estado="cama" id="P-002" nombre="Yolanda M." nivel="severe" etiqueta="cama" camisa="azul" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:10.776%;top:9.119%;width:2.586%" hint-size="2.586%,4.1%"></dc-import>
    <dc-import name="Personaje" tipo="paciente" estado="cama" id="P-004" nombre="Nelly A." nivel="moderate" etiqueta="cama" camisa="verde" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:53.448%;top:9.119%;width:2.586%" hint-size="2.586%,4.1%"></dc-import>
    <dc-import name="Personaje" tipo="doctor" id="D-01" nombre="Dr. Ospina" ocupado="{{ true }}" pelo="#2a1d14" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:5.172%;top:11.494%;width:3.103%" hint-size="3.103%,7.4%"></dc-import>
    <dc-import name="Personaje" tipo="doctor" id="D-02" nombre="Dr. Mendoza" ocupado="{{ false }}" pelo="#6b4320" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:67.026%;top:49.042%;width:3.103%" hint-size="3.103%,7.4%"></dc-import>
    <dc-import name="Personaje" tipo="camillero" id="O-01" nombre="Camillero" ocupado="{{ true }}" etiqueta="izquierda" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:57.759%;top:28.123%;width:9.569%" hint-size="9.569%,7.4%"></dc-import>
    <dc-import name="Personaje" tipo="paciente" estado="piso" id="P-003" nombre="Eder P." nivel="severe" tiempo="0:42" etiqueta="lado" camisa="turquesa" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:68.534%;top:29.042%;width:4.138%" hint-size="4.138%,5.5%"></dc-import>
    <dc-import name="Personaje" tipo="paciente" estado="despierto" id="P-001" nombre="Carmelo P." nivel="moderate" camisa="roja" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:44.612%;top:47.51%;width:3.103%" hint-size="3.103%,7.4%"></dc-import>
    <dc-import name="Personaje" tipo="paciente" estado="despierto" id="P-005" nombre="Wilmer O." nivel="mild" camisa="azul" etiquetas="{{ alt }}" on-hover="{{ hover }}" style="position:absolute;left:11.207%;top:50.575%;width:3.103%" hint-size="3.103%,7.4%"></dc-import>

    <div style="position:absolute;left:39.332%;top:71.648%;transform:translate(-50%,-100%);background:#2f6fd6;border:0.25cqw solid #141414;padding:0.25cqw 0.35cqw;font-size:0.55cqw;line-height:1;color:#ffffff;white-space:nowrap;box-shadow:inset -0.2cqw -0.2cqw 0 #2152a8,0.2cqw 0.3cqw 0 rgba(0,0,0,0.22)">BUS</div>
    <dc-import name="Personaje" tipo="paciente" estado="caminando" camisa="verde" style="position:absolute;left:51.293%;top:72.031%;width:3.103%" hint-size="3.103%,7.4%"></dc-import>
    <dc-import name="Personaje" tipo="paciente" estado="caminando" camisa="roja" style="position:absolute;left:44.569%;top:83.525%;width:3.103%" hint-size="3.103%,7.4%"></dc-import>
    <sc-if value="{{ hasTip }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:{{ tipLeft }};top:{{ tipTop }};transform:{{ tipTransform }};z-index:20;pointer-events:none;display:flex;flex-direction:column;gap:0.45cqw;background:#fbf8ef;border:0.25cqw solid #141414;padding:0.55cqw 0.65cqw;font-size:0.6cqw;line-height:1;color:#141414;white-space:nowrap;box-shadow:inset -0.25cqw -0.25cqw 0 #e3ddcc,0.3cqw 0.4cqw 0 rgba(0,0,0,0.25)">
        <div style="display:flex;gap:0.5cqw;align-items:center"><span style="color:{{ tip.idColor }}">{{ tip.id }}</span><span>{{ tip.nombre }}</span></div>
        <sc-if value="{{ tip.hasRol }}" hint-placeholder-val="{{ false }}"><div style="color:#5a616b">{{ tip.rol }}</div></sc-if>
        <sc-if value="{{ tip.hasLevel }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:0.4cqw;align-items:center">
            <span style="color:#5a616b">LEVEL</span>
            <span style="display:flex;gap:0.08cqw">
              <sc-for list="{{ tip.bolts }}" as="b" hint-placeholder-count="0">
                <svg viewBox="0 0 7 9" shape-rendering="crispEdges" style="width:0.6cqw;height:0.77cqw;display:block"><path fill="#141414" d="{{ b.k }}"></path><path fill="{{ b.c }}" d="{{ b.f }}"></path></svg>
              </sc-for>
            </span>
            <span>{{ tip.nivel }}</span>
          </div>
        </sc-if>
        <div style="display:flex;gap:0.4cqw;align-items:center">
          <span style="color:#5a616b">STATUS</span>
          <span style="width:0.65cqw;height:0.65cqw;box-sizing:border-box;background:{{ tip.estadoColor }};border:0.15cqw solid #141414"></span>
          <span>{{ tip.estado }}</span>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Mundo lógico de 464×261 (16:9), dibujado a 2× en el canvas (928×522).
  // Entorno (muros, pisos, calle): 2 px de canvas por px de mundo.
  // Escala oficial de sprites y muebles: 1,5× → 3 px de canvas por px de sprite (nítido, sin interpolar).
  // Franja HUD: y 0–14 · Edificio: (4,14)–(460,182) · Acera: y 182–210 · Calle: y 213–259.
  // Personajes: escala 1,2 (SVG superpuesto). Etiquetas ID/nombre ocultas: hover = tooltip, mantener Shift = todas.
  state = { alt: false, tip: null };
  worldRef = React.createRef();
  rootRef = React.createRef();

  componentDidMount() {
    this.draw();
    this.onDown = (e) => { if (e.key === 'Shift' && !this.state.alt) this.setState({ alt: true }); };
    this.onUp = (e) => { if (e.key === 'Shift') this.setState({ alt: false }); };
    this.onBlur = () => this.setState({ alt: false });
    window.addEventListener('keydown', this.onDown);
    window.addEventListener('keyup', this.onUp);
    window.addEventListener('blur', this.onBlur);
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this.onDown);
    window.removeEventListener('keyup', this.onUp);
    window.removeEventListener('blur', this.onBlur);
  }

  hover = (info, rect) => {
    if (!info || !rect || !this.rootRef.current) { this.setState({ tip: null }); return; }
    const R = this.rootRef.current.getBoundingClientRect();
    const cx = (rect.left + rect.width / 2 - R.left) / R.width * 100;
    const top = (rect.top - R.top) / R.height * 100;
    const below = top < 24;
    const y = below ? (rect.bottom - R.top) / R.height * 100 : top;
    this.setState({ tip: { ...info, x: Math.min(91, Math.max(9, cx)), y, below } });
  };

  draw() {
    const c = this.worldRef.current; if (!c) return;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const S = 2, SP = 3;
    const K = '#141414', Wt = '#f4f3ee', SH = 'rgba(60,40,10,0.22)';
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x * S, y * S, w * S, h * S); };
    const make = (w, h, fn) => {
      const W = w + 2, H = h + 2, o = document.createElement('canvas');
      o.width = W; o.height = H;
      const k = o.getContext('2d');
      fn((a, b, cw, ch, col) => { k.fillStyle = col; k.fillRect(a + 1, b + 1, cw, ch); });
      const d = k.getImageData(0, 0, W, H), p = d.data, m = new Uint8Array(W * H);
      for (let i = 0; i < W * H; i++) m[i] = p[i * 4 + 3] > 0 ? 1 : 0;
      for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
        const i = yy * W + xx; if (m[i]) continue;
        if ((xx > 0 && m[i - 1]) || (xx < W - 1 && m[i + 1]) || (yy > 0 && m[i - W]) || (yy < H - 1 && m[i + W])) {
          p[i * 4] = p[i * 4 + 1] = p[i * 4 + 2] = 20; p[i * 4 + 3] = 255;
        }
      }
      k.putImageData(d, 0, 0);
      return o;
    };
    // coloca un sprite con su px (0,0) en el punto (x,y) del mundo. sc = px de canvas por px de sprite.
    const put = (o, x, y, sh = true, sc = SP) => {
      const ox = x * S - sc, oy = y * S - sc, w = o.width * sc, h = o.height * sc;
      if (sh) {
        const s = document.createElement('canvas'); s.width = o.width; s.height = o.height;
        const k = s.getContext('2d'); k.drawImage(o, 0, 0);
        k.globalCompositeOperation = 'source-in'; k.fillStyle = SH; k.fillRect(0, 0, s.width, s.height);
        g.drawImage(s, ox + sc, oy + sc * 2, w, h);
      }
      g.drawImage(o, ox, oy, w, h);
    };
    const tiles = (x, y, w, h, a, b, s) => {
      for (let j = 0; j < h; j += s) for (let i = 0; i < w; i += s)
        R(x + i, y + j, Math.min(s, w - i), Math.min(s, h - j), ((i / s + j / s) % 2) ? b : a);
    };
    const edge = (x, y, w, h) => { R(x - 1, y - 1, w + 2, 1, K); R(x - 1, y + h, w + 2, 1, K); R(x - 1, y - 1, 1, h + 2, K); R(x + w, y - 1, 1, h + 2, K); };
    const ellipse = (cx, cy, rx, ry, col) => {
      for (let dy = -ry; dy <= ry; dy++) { const hw = Math.round(rx * Math.sqrt(1 - (dy / (ry + 0.5)) ** 2)); R(cx - hw, cy + dy, hw * 2, 1, col); }
    };
    // hoja de palma: cuchilla de 3 px que se afina en la punta, nervio oscuro y dientes pegados al borde
    const blade = (r, C0, deg, len, curve, fi, t0, every) => {
      const pts = [];
      for (let i = 0, t = t0; t <= len; i++, t += 0.5) {
        const a = (deg * Math.PI / 180) + curve * (t - t0);
        const ux = Math.cos(a), uy = Math.sin(a);
        const x = Math.round(C0 + ux * t), y = Math.round(C0 + uy * t);
        const half = t <= len - 3 ? 1 : 0;
        r(x - half, y - half, half * 2 + 1, half * 2 + 1, '#3cb54a');
        if (i % every === Math.floor(every / 2) && t < len - 1) {
          const side = (Math.floor(i / every) + fi) % 2 === 0 ? 1 : -1;
          if (Math.abs(ux) > Math.abs(uy)) r(x, y + side * (half + 1), 1, 1, '#3cb54a');
          else r(x + side * (half + 1), y, 1, 1, '#3cb54a');
        }
        pts.push([x, y]);
      }
      pts.slice(2, -2).forEach(([x, y]) => r(x, y, 1, 1, '#23863a'));
    };

    // ===== exterior =====
    R(0, 0, 464, 261, '#f3d68e');
    for (let i = 0; i < 280; i++) R((i * 67 + (i % 7) * 17) % 464, (i * 31) % 261, 2, 1, '#dcb76a');

    // ===== acera (28 px), bordillos y calle de 2 carriles =====
    tiles(0, 182, 464, 28, '#e3e5e8', '#d6d9de', 7);
    R(0, 210, 464, 2, Wt); R(0, 212, 464, 1, K);
    R(0, 213, 464, 46, '#4a4f57');
    for (let i = 0; i < 280; i++) R((i * 53 + (i % 5) * 19) % 464, 214 + (i * 7) % 44, 1, 1, '#3f444b');
    for (let x = 0; x < 464; x += 18) if (x + 11 < 197 || x > 231) R(x, 235, 11, 2, '#ffd23f');
    for (let y = 215; y < 257; y += 6) R(199, y, 30, 3, Wt);
    R(0, 259, 464, 1, K); R(0, 260, 464, 1, Wt);

    // ===== edificio =====
    R(7, 18, 456, 168, SH);
    R(4, 14, 456, 168, '#b9bfc8');
    R(4, 14, 456, 1, K); R(4, 181, 456, 1, K); R(4, 14, 1, 168, K); R(459, 14, 1, 168, K);
    const F = {
      r101: [8, 18, 96, 50], r102: [107, 18, 96, 50], r103: [206, 18, 96, 50], rad: [305, 18, 151, 50],
      h1: [8, 71, 448, 24], cafe: [8, 98, 120, 80], lobby: [131, 98, 166, 80], h2: [300, 98, 44, 80], staff: [347, 98, 109, 80],
    };
    ['r101', 'r102', 'r103'].forEach(k => tiles(...F[k], '#eceae4', '#e1ddd3', 6));
    tiles(...F.rad, '#dfe6ee', '#cfd8e2', 6);
    tiles(...F.h1, '#dde1e6', '#d3d8df', 8);
    tiles(...F.h2, '#dde1e6', '#d3d8df', 8);
    tiles(...F.cafe, '#c6ece6', '#aedfd7', 6);
    tiles(...F.lobby, '#f6e7bd', '#ecd59c', 8);
    R(...F.staff, '#dcae78');
    for (let y = 98; y < 178; y += 5) { R(347, y + 4, 109, 1, '#c4935c'); for (let x = 347 + ((y / 5) % 2) * 11; x < 456; x += 22) R(x, y, 1, 4, '#c4935c'); }
    Object.values(F).forEach(r => edge(...r));

    const hDoor = (x, y, w) => { R(x, y, w, 3, '#d7dce2'); R(x - 1, y, 1, 3, K); R(x + w, y, 1, 3, K); };
    const vDoor = (x, y, h) => { R(x, y, 3, h, '#d7dce2'); R(x, y - 1, 3, 1, K); R(x, y + h, 3, 1, K); };
    hDoor(76, 68, 14); hDoor(175, 68, 14); hDoor(274, 68, 14); hDoor(320, 68, 16);
    hDoor(90, 95, 14); hDoor(184, 95, 60); hDoor(300, 95, 44);
    vDoor(128, 150, 14); vDoor(344, 150, 14);
    R(199, 178, 30, 4, '#5a616b'); R(198, 178, 1, 4, K); R(229, 178, 1, 4, K);
    R(200, 179, 13, 2, '#9ddcf7'); R(215, 179, 13, 2, '#9ddcf7'); R(213, 178, 2, 4, K);

    // líneas guía: azul en Hallway 1, verde pegada al borde derecho de Hallway 2
    R(8, 82, 448, 2, '#2f6fd6');
    R(339, 84, 2, 94, '#2fb84f');

    const winH = (x, w) => { R(x, 15, w, 2, '#9ddcf7'); R(x, 15, 3, 1, '#ffffff'); R(x - 1, 15, 1, 2, K); R(x + w, 15, 1, 2, K); };
    const winV = (x, y, h) => { R(x, y, 2, h, '#9ddcf7'); R(x, y, 1, 3, '#ffffff'); R(x, y - 1, 2, 1, K); R(x, y + h, 2, 1, K); };
    winV(5, 110, 24); winV(5, 146, 24); winV(457, 110, 24); winV(457, 146, 24);

    // ===== habitaciones: cama centrada contra la pared, mesita, suero, ventana con cortinas, tapete y silla =====
    const bed = (occ) => make(12, 20, (r) => {
      r(0, 0, 12, 3, '#8a909a'); r(0, 3, 12, 17, '#fbf8ef'); r(10, 3, 2, 17, '#d9d3c5'); r(0, 3, 12, 1, K);
      r(1, 4, 10, 5, K); r(2, 5, 8, 3, '#ffffff'); r(2, 7, 8, 1, '#cfd6e3');
      if (occ) { r(0, 9, 12, 1, K); r(1, 10, 10, 10, '#2f6fd6'); r(1, 10, 10, 2, '#9ddcf7'); r(1, 18, 10, 2, '#2152a8'); r(5, 13, 1, 4, '#2152a8'); }
      else { r(0, 14, 12, 1, K); r(1, 15, 10, 5, '#2f6fd6'); r(1, 15, 10, 1, '#9ddcf7'); }
    });
    const stand = make(6, 6, (r) => { r(0, 0, 6, 6, '#b9773f'); r(0, 4, 6, 2, '#8f5a2c'); r(1, 1, 3, 3, K); r(2, 2, 1, 1, '#ffd23f'); });
    const iv = make(5, 9, (r) => { r(0, 0, 5, 1, '#8a909a'); r(1, 1, 3, 4, '#bff1ea'); r(3, 1, 1, 4, '#7fd0f2'); r(2, 5, 1, 3, '#8a909a'); r(0, 8, 5, 1, '#5a616b'); });
    const curtain = make(3, 5, (r) => { r(0, 0, 3, 5, '#22b8b0'); r(1, 0, 1, 5, '#1a9c9a'); r(0, 4, 3, 1, '#1a9c9a'); });
    const rug = make(16, 8, (r) => { r(0, 0, 16, 8, '#f5a623'); r(1, 1, 14, 6, '#ffd23f'); r(3, 3, 10, 2, '#e5484d'); r(1, 1, 1, 1, '#e5484d'); r(14, 6, 1, 1, '#e5484d'); });
    const visit = make(7, 7, (r) => { r(0, 0, 7, 7, '#e5484d'); r(0, 0, 7, 2, '#b8323a'); r(0, 2, 1, 5, '#b8323a'); r(6, 2, 1, 5, '#b8323a'); });
    [[8, true], [107, false], [206, true]].forEach(([x0, occ]) => {
      winH(x0 + 3, 22);
      put(curtain, x0 + 1, 18); put(curtain, x0 + 21, 18);
      put(rug, x0 + 6, 38, false);
      put(stand, x0 + 28, 19);
      put(bed(occ), x0 + 39, 19);
      put(iv, x0 + 60, 19);
      put(visit, x0 + 83, 55);
    });

    // ===== radiología: escáner de anillo con la camilla pasando por el hueco =====
    put(make(56, 8, (r) => { r(0, 0, 56, 8, '#c9ced6'); r(0, 6, 56, 2, '#8a909a'); r(2, 1, 52, 4, '#ffffff'); r(2, 4, 52, 1, '#cfd6e3'); r(3, 1, 6, 3, '#9ddcf7'); }), 338, 37);
    put(make(28, 28, (r) => {
      for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
        const dx = x - 13.5, dy = y - 13.5, d = Math.sqrt(dx * dx + dy * dy);
        if (d > 13.6 || d < 5.6) continue;
        let col = '#c9ced6';
        if (d < 6.8) col = '#9aa1ab';
        else if (d >= 9 && d < 10.2) col = '#2f6fd6';
        else if (d >= 11.8 && dx + dy > 4) col = '#8a909a';
        r(x, y, 1, 1, col);
      }
      r(13, 1, 2, 2, '#ffd23f');
    }), 359, 22);
    put(make(9, 9, (r) => { r(0, 0, 9, 9, '#ffd23f'); r(4, 4, 1, 1, K); r(3, 1, 3, 2, K); r(1, 5, 2, 3, K); r(6, 5, 2, 3, K); }), 309, 48, false);

    // ===== pasillo 1 =====
    put(make(7, 7, (r) => { r(0, 0, 7, 7, '#fbf8ef'); r(0, 5, 7, 2, '#d4cdbf'); r(1, 1, 5, 3, '#7fd0f2'); r(2, 1, 1, 1, '#ffffff'); }), 442, 74);

  renderVals() {
    const t = this.state.tip;
    return {
      worldRef: this.worldRef, rootRef: this.rootRef,
      alt: this.state.alt,
      hover: this.hover,
      hasTip: !!t,
      tip: t || { id: '', nombre: '', idColor: '#141414', hasRol: false, rol: '', hasLevel: false, bolts: [], nivel: '', estado: '', estadoColor: '#2fb84f' },
      tipLeft: t ? t.x + '%' : '0',
      tipTop: t ? t.y + '%' : '0',
      tipTransform: t && t.below ? 'translate(-50%, 0.8cqw)' : 'translate(-50%, calc(-100% - 2cqw))',
    };
  }
}
